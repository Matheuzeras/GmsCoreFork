name: Build microG FaceFix PR3899 APKs

on:
  push:
    branches:
      - fix/mlkit-face-coordinates-3899
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify ML Kit and build GmsCore APKs
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: "1"
      MICROG_FACEFIX_3899_BUILD: "1"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          df -h
      - name: Checkout this repository's patched source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test rotation coordinate mapping
        run: ./gradlew :play-services-vision-core:testDebugUnitTest
      - name: Build GmsCore debug APK (ephemeral debug signature)
        run: ./gradlew :play-services-core:assembleMapboxDefaultDebug
      - name: Build GmsCore unsigned release APK
        run: ./gradlew :play-services-core:assembleMapboxDefaultRelease
      - name: Verify patched GmsCore package and upgrade version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          mapfile -t apks < <(find play-services-core/build/outputs/apk -type f -name "*.apk")
          test "${#apks[@]}" -ge 2
          for apk in "${apks[@]}"; do
            info="$("$AAPT" dump badging "$apk" | grep "^package:" | head -1)"
            echo "$apk: $info"
            [[ "$info" == *"name='com.google.android.gms'"* ]]
            [[ "$info" == *"versionCode='252432035'"* ]]
            [[ "$info" == *"versionName='0.3.17.252432-facefix3899'"* ]]
          done
      - name: List APK output files
        if: always()
        run: find play-services-core/build/outputs/apk -type f -name "*.apk" -print || true
      - name: Sign Release APK using disposable TEST KEY for CorePatch experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/facefix-sign" "$GITHUB_WORKSPACE/facefix-corepatch"
          APK="$(find play-services-core/build/outputs/apk -type f -path "*/release/*.apk" -name "*.apk" -print -quit)"
          test -f "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          KEYSTORE="$RUNNER_TEMP/facefix-sign/test-only.jks"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias facefix -dname "CN=Experimental GmsCore FaceFix,OU=UNOFFICIAL,O=USER TEST" -keyalg RSA -keysize 3072 -validity 60 -storetype PKCS12 -noprompt
          ALIGNED="$RUNNER_TEMP/facefix-sign/release-aligned.apk"
          "$BT/zipalign" -f -p 4 "$APK" "$ALIGNED"
          OUTPUT="$GITHUB_WORKSPACE/facefix-corepatch/GmsCore-FaceFix3899-CorePatch-TEST-SIGNED.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias facefix --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --min-sdk-version 19 --out "$OUTPUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 19 "$OUTPUT"
          AAPT="$BT/aapt"
          INFO="$("$AAPT" dump badging "$OUTPUT" | grep "^package:" | head -n 1)"
          echo "$INFO"
          [[ "$INFO" == *"name='com.google.android.gms'"* ]]
          [[ "$INFO" == *"versionCode='252432035'"* ]]
          [[ "$INFO" == *"versionName='0.3.17.252432-facefix3899'"* ]]
          rm -f "$KEYSTORE"
          echo "### UNSIGNED-ORIGINAL-CERT NOTICE" >> "$GITHUB_STEP_SUMMARY"
          echo "The released CorePatch test APK is cryptographically signed with an EPHEMERAL TEST KEY, NOT the original NOGAPPS certificate. Use only on an intentionally modified Android device, at your own risk. No private signing key is retained." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload GmsCore FaceFix CorePatch test-signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GmsCore-FaceFix3899-CorePatch-TEST-SIGNED-Release
          path: facefix-corepatch/GmsCore-FaceFix3899-CorePatch-TEST-SIGNED.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload GmsCore FaceFix Debug (NOT ROM-compatible signing)
        uses: actions/upload-artifact@v4
        with:
          name: GmsCore-FaceFix3899-MapboxDefault-Debug-TEST-KEY
          path: play-services-core/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload GmsCore FaceFix Release (UNSIGNED)
        uses: actions/upload-artifact@v4
        with:
          name: GmsCore-FaceFix3899-MapboxDefault-Release-UNSIGNED
          path: play-services-core/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 14
