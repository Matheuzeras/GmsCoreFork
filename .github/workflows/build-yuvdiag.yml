name: Build passive YUV face crash diagnostics
on:
  push:
    branches:
      - diagnostic/yuv-face-mercadopago
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build passive logging-only LSPosed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble logging-only diagnostic APK
        run: ./gradlew -p experiments/lsposed-yuvdiag :app:assembleDebug
      - name: Publish YUV diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: YuvFaceDiag-LSPosed-PASSIVE
          path: experiments/lsposed-yuvdiag/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
